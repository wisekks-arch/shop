<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디 / 비밀번호 찾기 - EASYSHOP</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Global Navbar -->
  <div id="navbar-root"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-xl relative overflow-hidden">
      
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-teal-400"></div>

      <!-- Header -->
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black tracking-tight text-slate-900">계정 정보 찾기</h1>
        <p class="text-xs text-slate-500">가입 시 등록하신 정보로 아이디 및 비밀번호를 찾으실 수 있습니다.</p>
      </div>

      <!-- Tab Buttons -->
      <div class="flex p-1 bg-slate-100 rounded-2xl text-xs font-bold">
        <button id="tab-btn-id" onclick="switchTab('id')" class="flex-1 py-2.5 rounded-xl bg-white text-indigo-600 shadow-sm transition cursor-pointer flex items-center justify-center gap-1.5">
          <i data-lucide="user" class="w-3.5 h-3.5"></i>
          <span>아이디 찾기</span>
        </button>
        <button id="tab-btn-pw" onclick="switchTab('pw')" class="flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition cursor-pointer flex items-center justify-center gap-1.5">
          <i data-lucide="key" class="w-3.5 h-3.5"></i>
          <span>비밀번호 찾기</span>
        </button>
      </div>

      <!-- ==================== 1. TAB: FIND ID ==================== -->
      <section id="pane-find-id" class="space-y-4 text-xs">
        <form onsubmit="handleFindId(event)" class="space-y-4">
          <div>
            <label for="find-id-name" class="block font-bold text-slate-700 mb-1">성명</label>
            <input type="text" id="find-id-name" required placeholder="가입 시 등록한 성명" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition">
          </div>

          <div>
            <label for="find-id-phone" class="block font-bold text-slate-700 mb-1">휴대폰 번호</label>
            <input type="tel" id="find-id-phone" required placeholder="010-1234-5678" oninput="formatPhone(this)" maxlength="13" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition">
          </div>

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-md shadow-indigo-600/20 transition cursor-pointer">
            아이디(이메일) 찾기
          </button>
        </form>

        <!-- Result Box -->
        <div id="find-id-result" class="hidden p-5 bg-indigo-50 border border-indigo-200 rounded-2xl space-y-3 text-center">
          <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 mx-auto flex items-center justify-center font-bold">
            <i data-lucide="check" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="text-xs text-slate-600"><span id="res-user-name" class="font-bold text-slate-900"></span>님의 가입 아이디(이메일)입니다.</p>
            <p id="res-user-email" class="text-base font-black text-indigo-700 mt-1"></p>
          </div>
          <div class="pt-2 flex gap-2">
            <a href="login.html" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-center transition">
              로그인하기
            </a>
            <button onclick="switchTab('pw')" class="flex-1 py-2.5 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-50 transition cursor-pointer">
              비밀번호 찾기
            </button>
          </div>
        </div>
      </section>

      <!-- ==================== 2. TAB: FIND & RESET PASSWORD ==================== -->
      <section id="pane-find-pw" class="hidden space-y-4 text-xs">
        
        <!-- Step 1: Input Email & Request Temp Password -->
        <div id="pw-step-1" class="space-y-4">
          <p class="text-slate-500 leading-relaxed">
            가입하신 이메일(아이디)을 입력하시면, 해당 이메일로 <span class="font-bold text-slate-800">임시 비밀번호</span>를 발송해 드립니다.
          </p>
          <form onsubmit="handleRequestTempPw(event)" class="space-y-4">
            <div>
              <label for="find-pw-email" class="block font-bold text-slate-700 mb-1">가입 이메일 (아이디)</label>
              <div class="relative">
                <input type="email" id="find-pw-email" required placeholder="example@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10">
                <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
              </div>
            </div>

            <button type="submit" id="btn-send-temp" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-md shadow-indigo-600/20 transition cursor-pointer flex items-center justify-center gap-2">
              <i data-lucide="send" class="w-4 h-4"></i>
              <span>임시 비밀번호 이메일 발송</span>
            </button>
          </form>
        </div>

        <!-- Step 2: Verify Temp Password & Reset to New Password -->
        <div id="pw-step-2" class="hidden space-y-4">
          <div class="p-3.5 bg-emerald-50 border border-emerald-200 rounded-2xl flex items-center gap-2.5 text-xs text-emerald-800">
            <i data-lucide="mail-check" class="w-4 h-4 text-emerald-600 shrink-0"></i>
            <div>
              <p class="font-bold">임시 비밀번호가 발송되었습니다.</p>
              <p class="text-[11px] text-emerald-700 mt-0.5" id="sent-email-label"></p>
            </div>
          </div>

          <form onsubmit="handleResetPassword(event)" class="space-y-4">
            <!-- 1. 임시 비밀번호 입력 -->
            <div>
              <label for="input-temp-pw" class="block font-bold text-slate-700 mb-1">발송된 임시 비밀번호 <span class="text-rose-500">*</span></label>
              <input type="text" id="input-temp-pw" required placeholder="이메일로 전송된 임시 비밀번호 입력" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition font-mono">
            </div>

            <!-- 2. 새 비밀번호 입력 -->
            <div class="space-y-1.5">
              <label for="new-password" class="block font-bold text-slate-700">새 비밀번호 설정 <span class="text-rose-500">*</span></label>
              <div class="relative">
                <input type="password" id="new-password" required placeholder="새 비밀번호 (@# + 소문자 + 숫자 8자 이상)" oninput="checkNewPwStrength(this.value)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10 pr-10">
                <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
              </div>

              <!-- 비밀번호 조건 체크 UI -->
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 space-y-1 text-[11px]">
                <p class="font-bold text-slate-600 mb-1">새 비밀번호 필수 조건:</p>
                <div class="grid grid-cols-2 gap-1">
                  <div id="new-rule-len" class="flex items-center gap-1.5 text-slate-400">
                    <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                    <span>8자 이상</span>
                  </div>
                  <div id="new-rule-lower" class="flex items-center gap-1.5 text-slate-400">
                    <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                    <span>영문 소문자 (a-z)</span>
                  </div>
                  <div id="new-rule-num" class="flex items-center gap-1.5 text-slate-400">
                    <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                    <span>숫자 (0-9)</span>
                  </div>
                  <div id="new-rule-special" class="flex items-center gap-1.5 text-slate-400">
                    <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                    <span>특수문자 (@ 또는 #)</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 3. 새 비밀번호 확인 -->
            <div>
              <label for="new-password-confirm" class="block font-bold text-slate-700 mb-1">새 비밀번호 확인 <span class="text-rose-500">*</span></label>
              <input type="password" id="new-password-confirm" required placeholder="새 비밀번호를 한 번 더 입력해 주세요" oninput="checkNewPwMatch()" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition">
              <p id="new-pw-match-msg" class="text-[11px] mt-1 hidden"></p>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-md shadow-indigo-600/20 transition cursor-pointer flex items-center justify-center gap-2">
              <i data-lucide="check" class="w-4 h-4"></i>
              <span>비밀번호 재설정 완료</span>
            </button>
          </form>
        </div>

      </section>

      <!-- Bottom Nav -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
        <a href="login.html" class="text-slate-500 hover:text-slate-800 font-bold flex items-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>로그인으로 돌아가기</span>
        </a>
        <a href="signup.html" class="font-bold text-indigo-600 hover:text-indigo-800 underline">
          회원가입하기
        </a>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="js/auth-store.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/components.js"></script>

  <script>
    let recoveryEmail = '';

    document.addEventListener('DOMContentLoaded', () => {
      ShopUI.initNavbar('navbar-root');
      ShopUI.initFooter('footer-root');

      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab');
      if (tab === 'pw') switchTab('pw');
      else switchTab('id');

      if (window.lucide) window.lucide.createIcons();
    });

    function switchTab(tab) {
      const isId = tab === 'id';
      document.getElementById('pane-find-id').classList.toggle('hidden', !isId);
      document.getElementById('pane-find-pw').classList.toggle('hidden', isId);

      const btnId = document.getElementById('tab-btn-id');
      const btnPw = document.getElementById('tab-btn-pw');
      
      if (isId) {
        btnId.className = 'flex-1 py-2.5 rounded-xl bg-white text-indigo-600 shadow-sm transition cursor-pointer flex items-center justify-center gap-1.5';
        btnPw.className = 'flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition cursor-pointer flex items-center justify-center gap-1.5';
      } else {
        btnPw.className = 'flex-1 py-2.5 rounded-xl bg-white text-indigo-600 shadow-sm transition cursor-pointer flex items-center justify-center gap-1.5';
        btnId.className = 'flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition cursor-pointer flex items-center justify-center gap-1.5';
      }

      if (window.lucide) window.lucide.createIcons();
    }

    function formatPhone(input) {
      let val = input.value.replace(/[^0-9]/g, '');
      if (val.length < 4) input.value = val;
      else if (val.length < 8) input.value = val.replace(/(\d{3})(\d+)/, '$1-$2');
      else input.value = val.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');
    }

    function handleFindId(e) {
      e.preventDefault();
      const name = document.getElementById('find-id-name').value.trim();
      const phone = document.getElementById('find-id-phone').value.trim();

      const res = AuthStore.findId(name, phone);
      if (!res.success) {
        alert(res.message);
        return;
      }

      document.getElementById('res-user-name').innerText = res.name;
      document.getElementById('res-user-email').innerText = res.maskedEmail;
      document.getElementById('find-id-result').classList.remove('hidden');
      if (window.lucide) window.lucide.createIcons();
    }

    function handleRequestTempPw(e) {
      e.preventDefault();
      const email = document.getElementById('find-pw-email').value.trim();

      const res = AuthStore.sendTempPassword(email);
      if (!res.success) {
        alert(res.message);
        return;
      }

      recoveryEmail = email;
      document.getElementById('sent-email-label').innerText = `수신 계정: ${email} (임시비밀번호: ${res.tempPassword})`;
      document.getElementById('input-temp-pw').value = res.tempPassword; // Auto fill for demo ease
      
      document.getElementById('pw-step-1').classList.add('hidden');
      document.getElementById('pw-step-2').classList.remove('hidden');

      alert(`[안내] ${email} 로 임시 비밀번호가 발송되었습니다.\n\n발송된 임시 비밀번호: ${res.tempPassword}\n\n임시 비밀번호를 입력하고 새 비밀번호를 설정해 주세요.`);
      if (window.lucide) window.lucide.createIcons();
    }

    function checkNewPwStrength(pw) {
      const hasLen = pw.length >= 8;
      const hasLower = /[a-z]/.test(pw);
      const hasNum = /[0-9]/.test(pw);
      const hasSpecial = /[@#]/.test(pw);

      updateRuleUI('new-rule-len', hasLen);
      updateRuleUI('new-rule-lower', hasLower);
      updateRuleUI('new-rule-num', hasNum);
      updateRuleUI('new-rule-special', hasSpecial);

      checkNewPwMatch();
      if (window.lucide) window.lucide.createIcons();
    }

    function updateRuleUI(id, isValid) {
      const el = document.getElementById(id);
      if (!el) return;
      if (isValid) {
        el.className = 'flex items-center gap-1.5 text-emerald-600 font-bold';
        el.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-600"></i>' + el.querySelector('span').outerHTML;
      } else {
        el.className = 'flex items-center gap-1.5 text-slate-400';
        el.innerHTML = '<i data-lucide="circle" class="w-3.5 h-3.5 text-slate-400"></i>' + el.querySelector('span').outerHTML;
      }
    }

    function checkNewPwMatch() {
      const pw = document.getElementById('new-password').value;
      const confirm = document.getElementById('new-password-confirm').value;
      const msg = document.getElementById('new-pw-match-msg');
      if (!confirm) {
        msg.classList.add('hidden');
        return;
      }
      msg.classList.remove('hidden');
      if (pw === confirm) {
        msg.textContent = '✓ 새 비밀번호가 일치합니다.';
        msg.className = 'text-[11px] mt-1 text-emerald-600 font-bold';
      } else {
        msg.textContent = '✗ 새 비밀번호가 일치하지 않습니다.';
        msg.className = 'text-[11px] mt-1 text-rose-500 font-bold';
      }
    }

    function handleResetPassword(e) {
      e.preventDefault();
      const tempPw = document.getElementById('input-temp-pw').value.trim();
      const newPw = document.getElementById('new-password').value;
      const confirm = document.getElementById('new-password-confirm').value;

      if (newPw !== confirm) {
        alert('새 비밀번호와 비밀번호 확인이 일치하지 않습니다.');
        document.getElementById('new-password-confirm').focus();
        return;
      }

      const res = AuthStore.resetPassword(recoveryEmail, tempPw, newPw);
      if (!res.success) {
        alert(res.message);
        return;
      }

      alert('비밀번호가 성공적으로 변경되었습니다! 새 비밀번호로 로그인해 주세요.');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
