<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - EASYSHOP</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Global Navbar -->
  <div id="navbar-root"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-xl relative overflow-hidden">
      
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-teal-400"></div>

      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center font-bold text-xl border border-indigo-100 shadow-sm">
          <i data-lucide="log-in" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">이지샵 로그인</h1>
        <p class="text-xs text-slate-500">회원 혜택과 주문 조회를 위해 로그인해 주세요.</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">이메일 주소 *</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="email" id="login-email" required placeholder="example@email.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">비밀번호 *</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="login-password" required placeholder="비밀번호 입력" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <!-- Quick Demo Login Button -->
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-[11px] text-slate-600">
          <span>테스트 체험 계정:</span>
          <button type="button" onclick="fillDemoLogin()" class="font-bold text-indigo-600 hover:text-indigo-700 transition cursor-pointer">체험계정 자동입력</button>
        </div>

        <button type="submit" class="w-full mt-4 py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition cursor-pointer flex items-center justify-center gap-2">
          <span>로그인</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- New member signup link -->
      <div class="text-center pt-4 border-t border-slate-100 text-xs text-slate-500">
        <span>아직 이지샵 회원이 아니신가요?</span>
        <a href="signup.html" class="ml-1 font-bold text-indigo-600 hover:text-indigo-700 transition">회원가입 (3,000P 지급)</a>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="js/auth-store.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ShopUI.renderNavbar('navbar-root');
      ShopUI.renderFooter('footer-root');
      if (window.lucide) window.lucide.createIcons();
    });

    function fillDemoLogin() {
      document.getElementById('login-email').value = 'demo@easyshop.kr';
      document.getElementById('login-password').value = 'password123';
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const result = AuthStore.login(email, password);
      if (!result.success) {
        alert(result.message);
        return;
      }

      ShopUI.showToast(`[${result.user.name}]님, 반갑습니다!`);
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);
    }
  </script>
</body>
</html>
