<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - EASYSHOP</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Daum Postcode API -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Global Navbar -->
  <div id="navbar-root"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-lg w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-xl relative overflow-hidden">
      
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-teal-400"></div>

      <!-- Header & Welcome Benefit Badge -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center font-bold shadow-inner">
          <i data-lucide="user-plus" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900">EASYSHOP 회원가입</h1>
        <p class="text-xs text-slate-500">신규 가입 시 <span class="text-indigo-600 font-bold">3,000P 웰컴 마일리지</span>와 <span class="text-indigo-600 font-bold">10% 할인 쿠폰</span>을 즉시 지급합니다.</p>
      </div>

      <!-- Signup Form -->
      <form id="signup-form" onsubmit="handleSignUp(event)" class="space-y-4 text-xs">
        
        <!-- 1. 성명 -->
        <div>
          <label for="name" class="block font-bold text-slate-700 mb-1">성명 <span class="text-rose-500">*</span></label>
          <div class="relative">
            <input type="text" id="name" required placeholder="홍길동" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <!-- 2. 이메일 (아이디) -->
        <div>
          <label for="email" class="block font-bold text-slate-700 mb-1">이메일 (아이디) <span class="text-rose-500">*</span></label>
          <div class="relative">
            <input type="email" id="email" required placeholder="example@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
          <p class="text-[11px] text-slate-400 mt-1">로그인 및 주문/배송 정보, 비밀번호 찾기 시 사용됩니다.</p>
        </div>

        <!-- 3. 휴대폰 번호 -->
        <div>
          <label for="phone" class="block font-bold text-slate-700 mb-1">휴대폰 번호 <span class="text-rose-500">*</span></label>
          <div class="relative">
            <input type="tel" id="phone" required placeholder="010-1234-5678" oninput="formatPhone(this)" maxlength="13" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10">
            <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <!-- 4. 배송지 주소 (Daum 우편번호 연동) -->
        <div class="space-y-2">
          <label class="block font-bold text-slate-700">배송지 주소 <span class="text-rose-500">*</span></label>
          <div class="flex gap-2">
            <input type="text" id="postcode" readonly placeholder="우편번호" class="w-1/3 px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 focus:outline-none">
            <button type="button" onclick="execDaumPostcode()" class="w-2/3 px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition flex items-center justify-center gap-1.5 cursor-pointer">
              <i data-lucide="search" class="w-3.5 h-3.5"></i>
              <span>우편번호 찾기</span>
            </button>
          </div>
          <input type="text" id="address" required readonly placeholder="기본 주소 (우편번호 검색 버튼 클릭)" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 focus:outline-none">
          <input type="text" id="addressDetail" placeholder="상세 주소 (동·호수 등)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition">
        </div>

        <!-- 5. 비밀번호 (규칙: @# + 소문자 + 숫자 8자 이상) -->
        <div class="space-y-1.5">
          <label for="password" class="block font-bold text-slate-700">비밀번호 <span class="text-rose-500">*</span></label>
          <div class="relative">
            <input type="password" id="password" required placeholder="비밀번호 (@# + 소문자 + 숫자 8자 이상)" oninput="checkPasswordStrength(this.value)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10 pr-10">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          
          <!-- 실시간 비밀번호 규칙 체크 표시 UI -->
          <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 space-y-1 text-[11px]">
            <p class="font-bold text-slate-600 mb-1.5">비밀번호 설정 필수 조건:</p>
            <div class="grid grid-cols-2 gap-1.5">
              <div id="rule-len" class="flex items-center gap-1.5 text-slate-400">
                <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                <span>최소 8자 이상</span>
              </div>
              <div id="rule-lower" class="flex items-center gap-1.5 text-slate-400">
                <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                <span>영문 소문자 (a-z)</span>
              </div>
              <div id="rule-num" class="flex items-center gap-1.5 text-slate-400">
                <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                <span>숫자 (0-9)</span>
              </div>
              <div id="rule-special" class="flex items-center gap-1.5 text-slate-400">
                <i data-lucide="circle" class="w-3.5 h-3.5"></i>
                <span>특수문자 (@ 또는 #)</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 6. 비밀번호 확인 -->
        <div>
          <label for="passwordConfirm" class="block font-bold text-slate-700 mb-1">비밀번호 확인 <span class="text-rose-500">*</span></label>
          <div class="relative">
            <input type="password" id="passwordConfirm" required placeholder="비밀번호를 한 번 더 입력해 주세요" oninput="checkPasswordMatch()" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10 pr-10">
            <i data-lucide="check-circle" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
          <p id="pw-match-msg" class="text-[11px] mt-1 hidden"></p>
        </div>

        <!-- 7. 이용약관 동의 -->
        <div class="pt-2 border-t border-slate-100 space-y-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="agree-all" onchange="toggleAllAgreements(this)" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            <span class="font-bold text-slate-900">모든 약관에 동의합니다 (필수 및 선택)</span>
          </label>
          <div class="pl-6 space-y-1.5 text-slate-600 text-[11px]">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" required class="agree-item w-3.5 h-3.5 rounded text-indigo-600 border-slate-300">
              <span>(필수) EASYSHOP 이용약관 동의</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" required class="agree-item w-3.5 h-3.5 rounded text-indigo-600 border-slate-300">
              <span>(필수) 개인정보 수집 및 이용 동의</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="agree-item w-3.5 h-3.5 rounded text-indigo-600 border-slate-300">
              <span>(선택) 마케팅 정보 및 이벤트 혜택 수신 동의</span>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="signup-btn" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-lg shadow-indigo-600/25 transition cursor-pointer flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>회원가입 완료하고 혜택 받기</span>
        </button>

      </form>

      <!-- Bottom Switch to Login -->
      <div class="text-center pt-2 border-t border-slate-100">
        <p class="text-xs text-slate-500">
          이미 계정이 있으신가요? 
          <a id="link-login" href="login.html" class="font-bold text-indigo-600 hover:text-indigo-800 underline ml-1">로그인하기</a>
        </p>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="js/auth-store.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ShopUI.initNavbar('navbar-root');
      ShopUI.initFooter('footer-root');
      
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      if (redirect) {
        document.getElementById('link-login').href = `login.html?redirect=${encodeURIComponent(redirect)}`;
      }

      if (window.lucide) window.lucide.createIcons();
    });

    // Daum Postcode Search
    function execDaumPostcode() {
      new daum.Postcode({
        oncomplete: function(data) {
          let addr = '';
          if (data.userSelectedType === 'R') {
            addr = data.roadAddress;
          } else {
            addr = data.jibunAddress;
          }
          document.getElementById('postcode').value = data.zonecode;
          document.getElementById('address').value = addr;
          document.getElementById('addressDetail').focus();
        }
      }).open();
    }

    // Phone Auto-formatting
    function formatPhone(input) {
      let val = input.value.replace(/[^0-9]/g, '');
      if (val.length < 4) {
        input.value = val;
      } else if (val.length < 8) {
        input.value = val.replace(/(\d{3})(\d+)/, '$1-$2');
      } else {
        input.value = val.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');
      }
    }

    // Password Strength & Rule Check
    function checkPasswordStrength(pw) {
      const hasLen = pw.length >= 8;
      const hasLower = /[a-z]/.test(pw);
      const hasNum = /[0-9]/.test(pw);
      const hasSpecial = /[@#]/.test(pw);

      updateRuleUI('rule-len', hasLen);
      updateRuleUI('rule-lower', hasLower);
      updateRuleUI('rule-num', hasNum);
      updateRuleUI('rule-special', hasSpecial);

      checkPasswordMatch();
      if (window.lucide) window.lucide.createIcons();
    }

    function updateRuleUI(id, isValid) {
      const el = document.getElementById(id);
      if (!el) return;
      if (isValid) {
        el.className = 'flex items-center gap-1.5 text-emerald-600 font-bold';
        el.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-600"></i>' + el.querySelector('span').outerHTML;
      } else {
        el.className = 'flex items-center gap-1.5 text-slate-400';
        el.innerHTML = '<i data-lucide="circle" class="w-3.5 h-3.5 text-slate-400"></i>' + el.querySelector('span').outerHTML;
      }
    }

    function checkPasswordMatch() {
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('passwordConfirm').value;
      const msg = document.getElementById('pw-match-msg');
      if (!confirm) {
        msg.classList.add('hidden');
        return;
      }
      msg.classList.remove('hidden');
      if (pw === confirm) {
        msg.textContent = '✓ 비밀번호가 일치합니다.';
        msg.className = 'text-[11px] mt-1 text-emerald-600 font-bold';
      } else {
        msg.textContent = '✗ 비밀번호가 일치하지 않습니다.';
        msg.className = 'text-[11px] mt-1 text-rose-500 font-bold';
      }
    }

    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function toggleAllAgreements(master) {
      document.querySelectorAll('.agree-item').forEach(cb => cb.checked = master.checked);
    }

    function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const postcode = document.getElementById('postcode').value.trim();
      const address = document.getElementById('address').value.trim();
      const addressDetail = document.getElementById('addressDetail').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      if (password !== passwordConfirm) {
        alert('비밀번호와 비밀번호 확인이 일치하지 않습니다.');
        document.getElementById('passwordConfirm').focus();
        return;
      }

      const fullAddress = postcode ? `(${postcode}) ${address}` : address;
      const res = AuthStore.signUp({
        name,
        email,
        phone,
        address: fullAddress,
        addressDetail,
        password
      });

      if (!res.success) {
        alert(res.message);
        return;
      }

      ShopUI.showToast(res.message);
      
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || 'index.html';
      setTimeout(() => {
        window.location.href = redirect;
      }, 800);
    }
  </script>
</body>
</html>
