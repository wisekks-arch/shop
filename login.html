<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - EASYSHOP</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Global Navbar -->
  <div id="navbar-root"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-xl relative overflow-hidden">
      
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-teal-400"></div>

      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center font-bold shadow-inner">
          <i data-lucide="log-in" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900">EASYSHOP 로그인</h1>
        <p class="text-xs text-slate-500">가입하신 이메일 아이디와 비밀번호를 입력해 주세요.</p>
      </div>

      <!-- Redirect Notice (if triggered by auth guard e.g. checkout) -->
      <div id="redirect-notice" class="hidden p-3.5 bg-amber-50 border border-amber-200/80 rounded-2xl flex items-center gap-2.5 text-xs text-amber-800 font-medium">
        <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0"></i>
        <span>상품 구매 및 결제를 진행하시려면 로그인이 필요합니다.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        
        <!-- 이메일 (아이디) -->
        <div>
          <label for="email" class="block font-bold text-slate-700 mb-1">이메일 (아이디)</label>
          <div class="relative">
            <input type="email" id="email" required placeholder="example@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <!-- 비밀번호 -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="font-bold text-slate-700">비밀번호</label>
            <a href="find-account.html?tab=pw" class="text-[11px] font-bold text-indigo-600 hover:text-indigo-800 underline">비밀번호 찾기</a>
          </div>
          <div class="relative">
            <input type="password" id="password" required placeholder="비밀번호 입력 (@# + 소문자 + 숫자 8자 이상)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition pl-10 pr-10">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember Email & Find ID -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600">
            <input type="checkbox" id="remember-email" class="w-4 h-4 rounded text-indigo-600 border-slate-300">
            <span>아이디 저장</span>
          </label>
          <a href="find-account.html?tab=id" class="text-[11px] font-bold text-slate-500 hover:text-slate-800 underline">아이디 찾기</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-btn" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-lg shadow-indigo-600/25 transition cursor-pointer flex items-center justify-center gap-2">
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
          <span>로그인</span>
        </button>

      </form>

      <!-- Bottom Links -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
        <span class="text-slate-500">아직 계정이 없으신가요?</span>
        <a id="link-signup" href="signup.html" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 font-bold text-slate-700 border border-slate-200 transition">
          회원가입하기
        </a>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="js/auth-store.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ShopUI.initNavbar('navbar-root');
      ShopUI.initFooter('footer-root');

      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      if (redirect) {
        document.getElementById('redirect-notice').classList.remove('hidden');
        document.getElementById('link-signup').href = `signup.html?redirect=${encodeURIComponent(redirect)}`;
      }

      // Check remembered email
      const savedEmail = localStorage.getItem('easyshop_saved_email');
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
        document.getElementById('remember-email').checked = true;
      }

      if (window.lucide) window.lucide.createIcons();
    });

    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember-email').checked;

      if (remember) {
        localStorage.setItem('easyshop_saved_email', email);
      } else {
        localStorage.removeItem('easyshop_saved_email');
      }

      const res = AuthStore.login(email, password);
      if (!res.success) {
        alert(res.message);
        return;
      }

      ShopUI.showToast(`환영합니다, ${res.user.name}님! 로그인되었습니다.`);
      
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || 'index.html';
      setTimeout(() => {
        window.location.href = redirect;
      }, 500);
    }
  </script>
</body>
</html>
