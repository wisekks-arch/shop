<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 / 결제하기 - EASYSHOP</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css?v=20261006_v16">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

  <!-- Global Navbar -->
  <div id="navbar-root"></div>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    
    <div class="mb-8">
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight font-heading">
        주문서 작성 및 결제
      </h1>
      <p class="text-xs text-slate-500 mt-1">배송지 정보와 결제 수단을 확인해 주세요.</p>
    </div>

    <form id="checkout-form" onsubmit="handleOrderSubmit(event)" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left: Form Information (8 cols) -->
      <div class="lg:col-span-8 space-y-6">
        
        <!-- 1. Orderer Info -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-xs space-y-4">
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="user" class="w-4 h-4 text-indigo-600"></i> 주문자 정보
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1.5">주문자 성명 *</label>
              <input type="text" id="order-name" required value="홍길동" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1.5">연락처 *</label>
              <input type="tel" id="order-phone" required value="010-1234-5678" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" />
            </div>
            <div class="sm:col-span-2">
              <label class="block font-bold text-slate-700 mb-1.5">이메일 *</label>
              <input type="email" id="order-email" required value="customer@example.com" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" />
            </div>
          </div>
        </div>

        <!-- 2. Shipping Address -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-xs space-y-4">
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-4 h-4 text-indigo-600"></i> 배송지 정보
          </h3>
          <div class="space-y-3 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">수령인 성명 *</label>
                <input type="text" id="ship-name" required value="홍길동" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">수령인 연락처 *</label>
                <input type="tel" id="ship-phone" required value="010-1234-5678" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" />
              </div>
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1.5">기본 주소 *</label>
              <input type="text" id="ship-address" required value="서울특별시 강남구 테헤란로 152 강남파이낸스센터" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" />
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1.5">상세 주소</label>
              <input type="text" id="ship-address-detail" value="18층 1802호" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" />
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1.5">배송 요청사항</label>
              <select id="ship-note" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none bg-white">
                <option value="부재 시 문 앞에 놓아주세요.">부재 시 문 앞에 놓아주세요.</option>
                <option value="배송 전 연락 부탁드립니다.">배송 전 연락 부탁드립니다.</option>
                <option value="경비실에 맡겨주세요.">경비실에 맡겨주세요.</option>
                <option value="택배함에 넣어주세요.">택배함에 넣어주세요.</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 3. Discount Benefits (Coupons & Points) -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-xs space-y-5">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
              <i data-lucide="ticket" class="w-4 h-4 text-indigo-600"></i> 할인 혜택 적용 (쿠폰 & 포인트)
            </h3>
            <span id="co-member-badge" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-indigo-50 text-indigo-700">회원 혜택</span>
          </div>

          <!-- Coupon Selection -->
          <div class="space-y-2">
            <div class="flex items-center justify-between text-xs">
              <label class="font-bold text-slate-700 flex items-center gap-1.5">
                <i data-lucide="gift" class="w-3.5 h-3.5 text-rose-500"></i> 보유 쿠폰 선택
              </label>
              <span class="text-slate-400">적용 가능 <strong id="co-coupon-count" class="text-indigo-600">0</strong>장</span>
            </div>
            <select 
              id="co-coupon-select" 
              onchange="handleCouponChange()"
              class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none bg-white text-xs font-semibold"
            >
              <option value="">쿠폰을 선택해 주세요</option>
            </select>
            <p id="co-coupon-msg" class="text-[11px] text-slate-400">최대 할인 혜택을 받을 수 있는 쿠폰을 선택해 보세요.</p>
          </div>

          <!-- Points Usage -->
          <div class="space-y-2 pt-3 border-t border-slate-100">
            <div class="flex items-center justify-between text-xs">
              <label class="font-bold text-slate-700 flex items-center gap-1.5">
                <i data-lucide="coins" class="w-3.5 h-3.5 text-amber-500"></i> 보유 포인트 사용
              </label>
              <span class="text-slate-500">보유 포인트: <strong id="co-avail-points" class="text-amber-500 font-extrabold font-mono">0P</strong></span>
            </div>
            <div class="flex gap-2">
              <div class="relative flex-1">
                <input 
                  type="number" 
                  id="co-points-input" 
                  min="0"
                  step="100"
                  placeholder="0" 
                  oninput="handlePointsChange()"
                  class="w-full pl-3 pr-8 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none text-xs font-bold font-mono"
                />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">P</span>
              </div>
              <button 
                type="button" 
                onclick="useAllPoints()"
                class="px-4 py-2.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 rounded-xl text-xs font-bold transition shrink-0 cursor-pointer border border-slate-200"
              >
                전액사용
              </button>
            </div>
            <p class="text-[11px] text-slate-400">100P 단위로 사용 가능하며, 결제 금액을 초과할 수 없습니다.</p>
          </div>
        </div>

        <!-- 4. Payment Method -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-xs space-y-4">
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="credit-card" class="w-4 h-4 text-indigo-600"></i> 결제 수단 선택
          </h3>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs font-bold">
            <label class="flex flex-col items-center gap-2 p-4 rounded-2xl border border-indigo-600 bg-indigo-50/40 cursor-pointer text-center">
              <input type="radio" name="pay_method" value="신용/체크카드" checked class="text-indigo-600" />
              <span>신용/체크카드</span>
            </label>
            <label class="flex flex-col items-center gap-2 p-4 rounded-2xl border border-slate-200 hover:border-slate-300 cursor-pointer text-center">
              <input type="radio" name="pay_method" value="카카오페이" class="text-indigo-600" />
              <span>카카오페이</span>
            </label>
            <label class="flex flex-col items-center gap-2 p-4 rounded-2xl border border-slate-200 hover:border-slate-300 cursor-pointer text-center">
              <input type="radio" name="pay_method" value="토스페이" class="text-indigo-600" />
              <span>토스페이</span>
            </label>
            <label class="flex flex-col items-center gap-2 p-4 rounded-2xl border border-slate-200 hover:border-slate-300 cursor-pointer text-center">
              <input type="radio" name="pay_method" value="가상계좌 (무통장)" class="text-indigo-600" />
              <span>가상계좌 입금</span>
            </label>
          </div>
        </div>

      </div>

      <!-- Right: Ordered Items Summary & Submit (4 cols) -->
      <div class="lg:col-span-4 space-y-6">
        
        <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs space-y-4">
          <h3 class="text-sm font-black text-slate-900 pb-3 border-b border-slate-100">주문 상품 목록</h3>
          
          <div id="checkout-items-list" class="space-y-3 max-h-60 overflow-y-auto divide-y divide-slate-100">
            <!-- Dynamically listed items -->
          </div>

          <div class="pt-4 border-t border-slate-100 space-y-2 text-xs text-slate-600">
            <div class="flex items-center justify-between">
              <span>상품 금액</span>
              <span id="co-prod-total" class="font-bold text-slate-900">0원</span>
            </div>
            <div class="flex items-center justify-between">
              <span>쿠폰 할인</span>
              <span id="co-coupon-discount" class="font-bold text-rose-500">-0원</span>
            </div>
            <div class="flex items-center justify-between">
              <span>포인트 사용</span>
              <span id="co-points-discount" class="font-bold text-amber-600">-0P</span>
            </div>
            <div class="flex items-center justify-between">
              <span>배송비</span>
              <span id="co-shipping-fee" class="font-bold text-slate-900">0원</span>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-baseline justify-between">
            <span class="text-sm font-black text-slate-900">총 결제 금액</span>
            <span id="co-final-total" class="text-2xl font-black text-indigo-600 font-heading">0원</span>
          </div>

          <div class="pt-4 space-y-2">
            <label class="flex items-start gap-2 text-[11px] text-slate-500 cursor-pointer">
              <input type="checkbox" required class="mt-0.5 rounded text-indigo-600" />
              <span>구매조건 확인 및 결제진행 동의 (전자상거래법 제8조)</span>
            </label>
          </div>

          <button 
            type="submit" 
            class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold rounded-2xl shadow-xl shadow-indigo-600/30 transition text-sm flex items-center justify-center gap-2 cursor-pointer"
          >
            <i data-lucide="lock" class="w-4 h-4"></i>
            <span id="pay-button-text">결제 및 주문완료</span>
          </button>
        </div>

      </div>

    </form>

  </main>

  <!-- Global Footer -->
  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="js/auth-store.js?v=20261007_v3"></script>
  <script src="js/cart-store.js?v=20261007_v3"></script>
  <script src="js/api.js?v=20261007_v3"></script>
  <script src="js/components.js?v=20261007_v3"></script>
  <script>
    let couponDiscount = 0;
    let selectedCoupon = null;
    let appliedPoints = 0;
    let summary = null;
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      ShopUI.renderNavbar();
      ShopUI.renderFooter();

      // Load Logged-in User
      currentUser = typeof AuthStore !== 'undefined' ? AuthStore.getCurrentUser() : null;
      if (currentUser) {
        if (currentUser.name && document.getElementById('order-name')) document.getElementById('order-name').value = currentUser.name;
        if (currentUser.phone && document.getElementById('order-phone')) document.getElementById('order-phone').value = currentUser.phone;
        if (currentUser.email && document.getElementById('order-email')) document.getElementById('order-email').value = currentUser.email;
        if (currentUser.name && document.getElementById('ship-name')) document.getElementById('ship-name').value = currentUser.name;
        if (currentUser.phone && document.getElementById('ship-phone')) document.getElementById('ship-phone').value = currentUser.phone;
        if (currentUser.address && document.getElementById('ship-address')) document.getElementById('ship-address').value = currentUser.address;
        if (currentUser.addressDetail && document.getElementById('ship-address-detail')) document.getElementById('ship-address-detail').value = currentUser.addressDetail;

        // Points
        const availPoints = currentUser.points || 0;
        document.getElementById('co-avail-points').innerText = `${availPoints.toLocaleString()}P`;

        // Coupons
        loadMemberCoupons();
      } else {
        const badge = document.getElementById('co-member-badge');
        if (badge) {
          badge.className = 'px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-500';
          badge.innerText = '비회원 주문';
        }
        document.getElementById('co-avail-points').innerText = '0P (비회원)';
        document.getElementById('co-points-input').disabled = true;
        document.getElementById('co-coupon-select').disabled = true;
      }

      // Read URL coupon parameter if passed from cart
      const urlParams = new URLSearchParams(window.location.search);
      const urlCoupon = parseInt(urlParams.get('coupon')) || 0;
      if (urlCoupon > 0) {
        couponDiscount = urlCoupon;
      }

      summary = CartStore.getSummary(0);
      if (summary.selectedItems.length === 0) {
        alert('주문할 상품이 없습니다.');
        window.location.href = 'cart.html';
        return;
      }

      renderCheckoutSummary();
    });

    function loadMemberCoupons() {
      const select = document.getElementById('co-coupon-select');
      const countEl = document.getElementById('co-coupon-count');
      if (!select || typeof AuthStore === 'undefined') return;

      const coupons = AuthStore.getUserCoupons();
      if (countEl) countEl.innerText = coupons.length;

      select.innerHTML = '<option value="">선택 안 함 (쿠폰 미적용)</option>' + coupons.map(c => `
        <option value="${c.id}" data-discount="${c.discount}" data-min="${c.minOrder || 0}">
          ${c.name} (-${ShopUI.formatPrice(c.discount)})
        </option>
      `).join('');
    }

    function handleCouponChange() {
      const select = document.getElementById('co-coupon-select');
      const selectedOption = select.options[select.selectedIndex];
      const couponId = select.value;
      const msgEl = document.getElementById('co-coupon-msg');

      if (!couponId) {
        couponDiscount = 0;
        selectedCoupon = null;
        if (msgEl) msgEl.innerText = '쿠폰이 적용되지 않았습니다.';
      } else {
        const discount = parseInt(selectedOption.getAttribute('data-discount')) || 0;
        const minOrder = parseInt(selectedOption.getAttribute('data-min')) || 0;

        if (summary.productTotal < minOrder) {
          alert(`해당 쿠폰은 최소 주문금액 ${ShopUI.formatPrice(minOrder)} 이상 시 사용 가능합니다.`);
          select.value = '';
          couponDiscount = 0;
          selectedCoupon = null;
          if (msgEl) msgEl.innerText = `최소 ${ShopUI.formatPrice(minOrder)} 이상 주문 시 사용 가능`;
        } else {
          couponDiscount = discount;
          selectedCoupon = {
            id: couponId,
            name: selectedOption.text.split(' (-')[0],
            discount: discount
          };
          if (msgEl) msgEl.innerHTML = `<span class="text-rose-600 font-bold">🎉 [${selectedCoupon.name}] -${ShopUI.formatPrice(discount)} 할인 적용!</span>`;
        }
      }

      // Check points boundary after coupon applied
      handlePointsChange();
      renderCheckoutSummary();
    }

    function handlePointsChange() {
      const input = document.getElementById('co-points-input');
      if (!input || !currentUser) return;

      let val = parseInt(input.value) || 0;
      const userMaxPoints = currentUser.points || 0;

      // Max payable with points: (productTotal + shippingFee - couponDiscount)
      const maxPayable = Math.max(0, summary.productTotal + summary.shippingFee - couponDiscount);
      const effectiveMax = Math.min(userMaxPoints, maxPayable);

      if (val > effectiveMax) {
        val = effectiveMax;
        input.value = val;
      }
      if (val < 0) {
        val = 0;
        input.value = 0;
      }

      appliedPoints = val;
      renderCheckoutSummary();
    }

    function useAllPoints() {
      if (!currentUser) {
        alert('포인트는 로그인 회원만 사용 가능합니다.');
        return;
      }
      const userMaxPoints = currentUser.points || 0;
      const maxPayable = Math.max(0, summary.productTotal + summary.shippingFee - couponDiscount);
      const effectiveMax = Math.min(userMaxPoints, maxPayable);

      const input = document.getElementById('co-points-input');
      if (input) {
        input.value = effectiveMax;
        handlePointsChange();
      }
    }

    function renderCheckoutSummary() {
      const container = document.getElementById('checkout-items-list');
      container.innerHTML = summary.selectedItems.map(item => `
        <div class="flex gap-3 pt-3 first:pt-0">
          <img src="${item.thumbnail}" alt="${item.name}" class="w-12 h-12 rounded-xl object-cover border border-slate-100 shrink-0" />
          <div class="flex-1 min-w-0">
            <h4 class="text-xs font-bold text-slate-800 line-clamp-1">${item.name}</h4>
            <p class="text-[11px] text-slate-400">${item.selectedOption ? item.selectedOption + ' / ' : ''}${item.quantity}개</p>
            <span class="text-xs font-black text-indigo-600">${ShopUI.formatPrice(item.price * item.quantity)}</span>
          </div>
        </div>
      `).join('');

      // Calculations
      const prodTotal = summary.productTotal;
      const shipFee = summary.shippingFee;
      const finalAmount = Math.max(0, prodTotal + shipFee - couponDiscount - appliedPoints);

      document.getElementById('co-prod-total').innerText = ShopUI.formatPrice(prodTotal);
      document.getElementById('co-coupon-discount').innerText = couponDiscount > 0 ? `-${ShopUI.formatPrice(couponDiscount)}` : '-0원';
      document.getElementById('co-points-discount').innerText = appliedPoints > 0 ? `-${appliedPoints.toLocaleString()}P` : '-0P';
      document.getElementById('co-shipping-fee').innerText = shipFee === 0 ? '무료' : ShopUI.formatPrice(shipFee);
      document.getElementById('co-final-total').innerText = ShopUI.formatPrice(finalAmount);
      document.getElementById('pay-button-text').innerText = `${ShopUI.formatPrice(finalAmount)} 결제하기`;
    }

    async function handleOrderSubmit(e) {
      e.preventDefault();

      const prodTotal = summary.productTotal;
      const shipFee = summary.shippingFee;
      const finalAmount = Math.max(0, prodTotal + shipFee - couponDiscount - appliedPoints);

      const orderData = {
        customerName: document.getElementById('order-name').value,
        customerPhone: document.getElementById('order-phone').value,
        customerEmail: document.getElementById('order-email').value,
        shippingName: document.getElementById('ship-name').value,
        shippingPhone: document.getElementById('ship-phone').value,
        shippingAddress: `${document.getElementById('ship-address').value} ${document.getElementById('ship-address-detail').value}`,
        shippingNote: document.getElementById('ship-note').value,
        paymentMethod: document.querySelector('input[name="pay_method"]:checked').value,
        items: summary.selectedItems,
        totalAmount: finalAmount,
        originalProductTotal: prodTotal,
        shippingFee: shipFee,
        discountAmount: couponDiscount + appliedPoints + (summary.totalSavings || 0),
        couponDiscount: couponDiscount,
        couponId: selectedCoupon ? selectedCoupon.id : null,
        couponName: selectedCoupon ? selectedCoupon.name : null,
        usedPoints: appliedPoints
      };

      try {
        const result = await ShopAPI.createOrder(orderData);
        CartStore.removeSelected();

        // Deduct points and coupon in store
        if (typeof AuthStore !== 'undefined') {
          if (appliedPoints > 0) {
            AuthStore.deductPoints(appliedPoints);
          }
          if (selectedCoupon && selectedCoupon.id) {
            AuthStore.useCoupon(selectedCoupon.id);
          }
        }

        // Update member order stats
        try {
          if (currentUser) {
            const usersRaw = localStorage.getItem('easyshop_users_v3');
            if (usersRaw) {
              const users = JSON.parse(usersRaw);
              const uIdx = users.findIndex(u => u.email === currentUser.email || u.id === currentUser.id);
              if (uIdx >= 0) {
                users[uIdx].orderCount = (users[uIdx].orderCount || 0) + 1;
                users[uIdx].totalSpent = (users[uIdx].totalSpent || 0) + finalAmount;
                // Add 1% earned points
                const earned = Math.round(finalAmount * 0.01);
                users[uIdx].points = (users[uIdx].points || 0) + earned;
                localStorage.setItem('easyshop_users_v3', JSON.stringify(users));

                // Update current user points in session
                const updatedSession = { ...currentUser, points: users[uIdx].points };
                localStorage.setItem('easyshop_session_v3', JSON.stringify(updatedSession));
              }
            }
          }
        } catch (ue) {
          console.error('User stat update error:', ue);
        }

        const orderId = (result && result.order) ? result.order.orderId : (result && result.orderId ? result.orderId : ('ORD-' + Date.now().toString().slice(-8)));
        sessionStorage.setItem('latest_order', JSON.stringify((result && result.order) || orderData));
        window.location.href = `order-complete.html?orderId=${encodeURIComponent(orderId)}`;
      } catch (err) {
        alert('주문 처리 중 오류가 발생했습니다.');
        console.error(err);
      }
    }
  </script>
</body>
</html>
