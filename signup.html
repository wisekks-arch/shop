<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - EASYSHOP</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Global Navbar -->
  <div id="navbar-root"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-xl relative overflow-hidden">
      
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-teal-400"></div>

      <!-- Header & Welcome Benefit Badge -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center font-bold text-xl border border-indigo-100 shadow-sm">
          <i data-lucide="user-plus" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">이지샵 회원가입</h1>
        <p class="text-xs text-slate-500">지금 가입하고 풍성한 신규 회원 혜택을 즉시 받아보세요!</p>

        <!-- Welcome Benefit Box -->
        <div class="mt-4 p-3.5 rounded-2xl bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-100 text-left flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm">
            <i data-lucide="gift" class="w-4 h-4"></i>
          </div>
          <div class="text-[11px] leading-tight text-slate-700">
            <p class="font-bold text-indigo-700">가입 즉시 특별 혜택 자동 지급</p>
            <p class="text-slate-500 mt-0.5">3,000P 마일리지 + 10% 웰컴 할인 쿠폰</p>
          </div>
        </div>
      </div>

      <!-- Signup Form -->
      <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">이메일 주소 (아이디) *</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="email" id="signup-email" required placeholder="example@email.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">비밀번호 *</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="signup-password" required minlength="6" placeholder="6자리 이상 입력" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">비밀번호 확인 *</label>
          <div class="relative">
            <i data-lucide="shield-check" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="signup-password-confirm" required minlength="6" placeholder="비밀번호 재입력" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">이름 (실명) *</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="signup-name" required placeholder="홍길동" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">휴대폰 번호 *</label>
          <div class="relative">
            <i data-lucide="phone" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="tel" id="signup-phone" required placeholder="010-1234-5678" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">기본 배송지 주소 (선택)</label>
          <div class="relative">
            <i data-lucide="map-pin" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="signup-address" placeholder="예: 서울특별시 강남구 테헤란로 152" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:bg-white focus:border-indigo-500 transition">
          </div>
        </div>

        <!-- Terms agreement -->
        <div class="pt-2 space-y-2">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600">
            <input type="checkbox" id="agree-all" onchange="toggleAllTerms(this)" class="rounded border-slate-300 text-indigo-600 focus:ring-0">
            <span class="font-bold text-slate-800">모든 이용약관 및 개인정보 처리에 동의합니다. (필수)</span>
          </label>
        </div>

        <button type="submit" class="w-full mt-4 py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition cursor-pointer flex items-center justify-center gap-2">
          <span>무료 회원가입 완료</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Already member link -->
      <div class="text-center pt-4 border-t border-slate-100 text-xs text-slate-500">
        <span>이미 이지샵 회원이신가요?</span>
        <a href="login.html" class="ml-1 font-bold text-indigo-600 hover:text-indigo-700 transition">로그인하기</a>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="js/auth-store.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ShopUI.renderNavbar('navbar-root');
      ShopUI.renderFooter('footer-root');
      if (window.lucide) window.lucide.createIcons();
    });

    function toggleAllTerms(master) {
      // master check
    }

    function handleSignup(e) {
      e.preventDefault();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-password-confirm').value;
      const name = document.getElementById('signup-name').value.trim();
      const phone = document.getElementById('signup-phone').value.trim();
      const address = document.getElementById('signup-address').value.trim();
      const agree = document.getElementById('agree-all').checked;

      if (!agree) {
        alert('이용약관 및 개인정보 처리에 동의해 주세요.');
        return;
      }

      if (password !== confirm) {
        alert('비밀번호와 비밀번호 확인이 일치하지 않습니다.');
        return;
      }

      const result = AuthStore.signUp({ email, password, name, phone, address });
      if (!result.success) {
        alert(result.message);
        return;
      }

      ShopUI.showToast(result.message);
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    }
  </script>
</body>
</html>
